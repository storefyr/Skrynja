Name: harbour-skrynja
Summary: Skrynja - Mistral AI Chat for Sailfish OS
Description: |
  En Sailfish OS applikation der gør det muligt at stille spørgsmål til Mistral AI
  og modtage svar direkte på din enhed.
Version: 1.0
Release: 1
URL: https://mistral.ai
License: GPL-2.0

Requires: sailfishsilica-qt5 >= 1.0

Sources:
  - harbour-skrynja.pro
  - qml/*
  - qml/pages/*.qml
  - src/*
  - harbour-skrynja.desktop

PkgConfigBR:
  - Qt5Core
  - Qt5Qml
  - Qt5Quick
  - Qt5Network
  - sailfishapp

Files:
  - '%{_bindir}/%{name}'
  - '%{_datadir}/applications/%{name}.desktop'
  - '%{_datadir}/%{name}/qml/*'
  - '%{_datadir}/icons/hicolor/*x*/apps/%{name}.png'

Install: app
