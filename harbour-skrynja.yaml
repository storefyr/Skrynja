Name: harbour-skrynja
Summary: Chat med Mistral AI til Sailfish OS med websøgning
Version: 0.9.9
Release: 1
Group: Applications/Internet
URL: https://github.com/storefyr/Skrynja
License: MIT
Sources:
  - '%{name}-%{version}.tar.bz2'
Description: |
  Skrynja er en elegant klient til Mistral AI, integreret perfekt i
  Sailfish OS' brugerflade. Nyd intelligente samtaler med Mistral-modeller
  direkte fra din Sailfish-enhed, med adgang til websøgning.

  Funktioner:
  - Understøttelse af Mistrals gratis niveau
  - Mulighed for at bruge din egen API-nøgle
  - Streaming af svar i realtid
  - Websøgning via Mistrals Conversations-API
  - Native Sailfish-grænseflade med Silica-komponenter
  - Samtalehistorik
  - Valg mellem forskellige modeller

Builder: qmake5
PkgBR:
  - pkgconfig(sailfishapp) >= 1.0.2
  - pkgconfig(Qt5Core)
  - pkgconfig(Qt5Qml)
  - pkgconfig(Qt5Quick)
  - pkgconfig(Qt5Network)
  - pkgconfig(Qt5Multimedia)
  - desktop-file-utils
Requires:
  - sailfishsilica-qt5 >= 0.10.9
  - qt5-qtmultimedia
  - qt5-qtmultimedia-plugin-audio-pulseaudio
Files:
  - '%{_bindir}/%{name}'
  - '%{_datadir}/%{name}'
  - '%{_datadir}/applications/%{name}.desktop'
  - '%{_datadir}/icons/hicolor/*/apps/%{name}.png'
