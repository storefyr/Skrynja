Name: harbour-skrynja
Summary: Skrynja — Mistral AI chat
Description: |
  Stil spørgsmål til Mistral AI og få svar direkte på din Sailfish OS-enhed.
Version: 1.0
Release: 1
URL: https://github.com/storefyr/Skrynja
License: GPL-3.0

Requires:
  - sailfishsilica-qt5 >= 1.0

PkgConfigBR:
  - Qt5Core
  - Qt5Qml
  - Qt5Quick
  - Qt5Network
  - sailfishapp

Files:
  - '%{_bindir}/%{name}'
  - '%{_datadir}/applications/%{name}.desktop'
  - '%{_datadir}/%{name}/qml/*'
  - '%{_datadir}/icons/hicolor/*x*/apps/%{name}.png'
