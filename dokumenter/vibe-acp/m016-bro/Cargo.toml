[package]
name = "m016-bro"
version = "0.1.0"
edition = "2021"

[dependencies]
agent-client-protocol = { version = "=3.5.0", features = ["process"] }
agent-client-protocol-http = { version = "=3.5.0", features = ["server", "client"] }
agent-client-protocol-schema = "=1.12.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
axum = "0.8"

[[bin]]
name = "bro"
path = "src/bin/bro.rs"

[[bin]]
name = "klient"
path = "src/bin/klient.rs"
