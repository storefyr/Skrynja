name: PR Build Check

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  SAILFISH_RELEASE: '4.5.0.18'

jobs:
  unit-tests:
    name: "Unit tests"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qtbase5-dev qtbase5-dev-tools qt5-qmake qtmultimedia5-dev make g++

      - name: Build tests
        run: |
          export PATH=/usr/lib/qt5/bin:$PATH
          cd tests
          qmake tests.pro
          make -j2

      - name: Run tests
        run: cd tests && ./tst_skrynja

  build-check:
    name: "Build Check - ${{ matrix.arch }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM
        uses: R1tschY/sailfish-build-rpm@v1
        with:
          arch: ${{ matrix.arch }}
          release: ${{ env.SAILFISH_RELEASE }}
          fix-version: false

      - name: Verify RPM created
        run: |
          if [ -z "$(find RPMS -name '*.rpm' -type f)" ]; then
            echo "❌ Error: No RPM package was created"
            exit 1
          fi
          echo "✅ Build successful for ${{ matrix.arch }}"
          ls -lh RPMS/*.rpm

      - name: Push RPM to pr-rpm branch
        if: github.event_name == 'pull_request'
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          BRANCH="pr-${PR_NUM}-rpm"
          RPM_FILE=$(ls RPMS/harbour-skrynja-*.rpm | head -1)
          RPM_NAME=$(basename "$RPM_FILE")

          # Clone or create the pr-rpm branch (orphan, single file)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${BRANCH}"
            git checkout "${BRANCH}"
            rm -f harbour-skrynja-*.rpm
          else
            git checkout --orphan "${BRANCH}"
            git rm -rf . 2>/dev/null || true
          fi

          cp "$RPM_FILE" "${RPM_NAME}"
          git add "${RPM_NAME}"
          git commit -m "RPM for PR #${PR_NUM} (aarch64) - ${{ github.sha }}" || true
          git push origin "${BRANCH}"
          echo "RPM pushed to branch: ${BRANCH}"
          echo "Download: https://raw.githubusercontent.com/${{ github.repository }}/${BRANCH}/${RPM_NAME}"
