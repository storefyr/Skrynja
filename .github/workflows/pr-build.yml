name: PR Build Check

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  SAILFISH_RELEASE: '4.5.0.18'

permissions:
  contents: write

jobs:
  manifest-check:
    name: "Spec manifest kontrol"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout (fuld historik — kontrollen læser blob fra HEAD)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kontrol af spec-manifest.json
        run: python3 dokumenter/vibe-acp/kontrol-spec-manifest.py

  unit-tests:
    name: "Unit tests"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qtbase5-dev qtbase5-dev-tools qt5-qmake qtmultimedia5-dev make g++

      - name: Build tests
        run: |
          export PATH=/usr/lib/qt5/bin:$PATH
          cd tests
          qmake tests.pro
          make -j2

      - name: Run tests
        run: cd tests && ./tst_skrynja

  build-check:
    name: "Build Check - ${{ matrix.arch }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM
        uses: R1tschY/sailfish-build-rpm@v1
        with:
          arch: ${{ matrix.arch }}
          release: ${{ env.SAILFISH_RELEASE }}
          fix-version: false

      - name: Verify RPM created
        run: |
          if [ -z "$(find RPMS -name '*.rpm' -type f)" ]; then
            echo "❌ Error: No RPM package was created"
            exit 1
          fi
          echo "✅ Build successful for ${{ matrix.arch }}"
          ls -lh RPMS/*.rpm

      - name: Push RPM to pr-rpm branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PR_NUM=${{ github.event.pull_request.number }}
          BRANCH="pr-${PR_NUM}-rpm"
          RPM_FILE=$(ls RPMS/harbour-skrynja-*.rpm | head -1)
          # Fixed name so test-pr.sh does not need to parse the API
          RPM_NAME="skrynja-pr${PR_NUM}.rpm"
          API="https://api.github.com/repos/${{ github.repository }}"
          AUTH="Authorization: token ${GH_TOKEN}"

          json_get() { tr ',' '\n' | grep "\"$1\"" | head -1 | cut -d'"' -f4; }

          # 1. Get existing branch head (empty if branch does not exist)
          BRANCH_SHA=$(curl -s -H "$AUTH" "${API}/git/ref/heads/${BRANCH}" \
            | json_get sha || true)
          echo "Branch SHA: ${BRANCH_SHA:-<new branch>}"

          # 2. Upload RPM as a git blob via the API
          base64 -w0 "$RPM_FILE" > /tmp/rpm.b64
          printf '{"content":"' > /tmp/blob.json
          cat /tmp/rpm.b64 >> /tmp/blob.json
          printf '","encoding":"base64"}' >> /tmp/blob.json
          BLOB_SHA=$(curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
            -d @/tmp/blob.json "${API}/git/blobs" | json_get sha)
          rm -f /tmp/rpm.b64 /tmp/blob.json
          echo "Blob SHA: ${BLOB_SHA}"

          # 3. Create a tree with just the RPM file
          TREE_JSON=$(printf '{"tree":[{"path":"%s","mode":"100644","type":"blob","sha":"%s"}]}' \
            "$RPM_NAME" "$BLOB_SHA")
          NEW_TREE_SHA=$(curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
            -d "$TREE_JSON" "${API}/git/trees" | json_get sha)
          echo "Tree SHA: ${NEW_TREE_SHA}"

          # 4. Create the commit
          MSG="RPM for PR #${PR_NUM} (aarch64) - ${{ github.sha }}"
          if [ -n "$BRANCH_SHA" ]; then
            COMMIT_JSON=$(printf '{"message":"%s","tree":"%s","parents":["%s"]}' \
              "$MSG" "$NEW_TREE_SHA" "$BRANCH_SHA")
          else
            COMMIT_JSON=$(printf '{"message":"%s","tree":"%s"}' \
              "$MSG" "$NEW_TREE_SHA")
          fi
          NEW_COMMIT_SHA=$(curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
            -d "$COMMIT_JSON" "${API}/git/commits" | json_get sha)
          echo "Commit SHA: ${NEW_COMMIT_SHA}"

          # 5. Update or create the branch ref
          if [ -n "$BRANCH_SHA" ]; then
            curl -sf -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"sha\":\"${NEW_COMMIT_SHA}\",\"force\":true}" \
              "${API}/git/refs/heads/${BRANCH}"
          else
            curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"ref\":\"refs/heads/${BRANCH}\",\"sha\":\"${NEW_COMMIT_SHA}\"}" \
              "${API}/git/refs"
          fi

          echo "RPM pushed to branch: ${BRANCH}"
          echo "Download: https://raw.githubusercontent.com/${{ github.repository }}/${BRANCH}/${RPM_NAME}"
