name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  SAILFISH_RELEASE: '4.5.0.18'

jobs:
  build:
    name: "Build RPM for ${{ matrix.arch }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # RPM forbids '-' in Version, so manual builds use a plain number
            VERSION="0.1.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Update spec version
        run: |
          sed -i "s/^Version:.*/Version:    ${{ steps.version.outputs.version }}/" rpm/harbour-skrynja.spec
          cat rpm/harbour-skrynja.spec | grep "^Version:"

      - name: Build RPM
        uses: R1tschY/sailfish-build-rpm@v1
        with:
          arch: ${{ matrix.arch }}
          release: ${{ env.SAILFISH_RELEASE }}
          fix-version: false

      - name: List built packages
        run: ls -lh RPMS/

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: RPMS/*.rpm

  unit-tests:
    name: "Unit tests"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qtbase5-dev qtbase5-dev-tools qt5-qmake make g++

      - name: Build tests
        run: |
          export PATH=/usr/lib/qt5/bin:$PATH
          cd tests
          qmake tests.pro
          make -j2

      - name: Run tests
        run: cd tests && ./tst_skrynja

  create-release:
    needs: [build, unit-tests]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.1.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: rpms

      - name: List downloaded packages
        run: |
          ls -lhR rpms/
          find rpms/ -name "*.rpm" ! -name "*-debuginfo-*" ! -name "*-debugsource-*"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release body
        id: release_body
        run: |
          cat > release_notes.md << 'EOF'
          # Skrynja ${{ steps.version.outputs.version }}

          ## 🐱⛵ Installation

          Download the RPM package for your device:

          ### Supported Architectures
          - **aarch64**: Jolla Phone (2026), Jolla C2, Xperia 10, Xperia 10 II, Xperia 10 III, Xperia 10 IV

          Not sure? Run `uname -m` on the device: `aarch64` → aarch64 RPM.

          ### Install on Device
          ```bash
          # Transfer the RPM to your device, then:
          devel-su
          pkcon install-local harbour-skrynja-*.rpm
          ```

          Or use File Browser to tap on the RPM file.

          ## 📝 What's New

          ${{ steps.changelog.outputs.changelog }}

          ## 🚀 Quick Start

          1. Launch **Skrynja** from your app drawer
          2. Pull down and select **Settings**
          3. Enter your Mistral AI API key (get one free at [console.mistral.ai](https://console.mistral.ai))
          4. Choose your preferred model
          5. Optionally enable **web search**
          6. Start chatting with AI! 💬

          ## ℹ️ About

          Skrynja is a native Sailfish OS client for Mistral AI, built on the
          Conversations API (`/v1/conversations`) with:
          - Real-time streaming responses
          - Web search mid-conversation
          - Native Silica UI
          - Multiple model support
          - Conversation history
          - Secure local API key storage

          For more info, see the [README](https://github.com/storefyr/Skrynja/blob/main/README.md).
          EOF
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          files: |
            rpms/rpm-aarch64/*.rpm
          draft: false
          prerelease: false
